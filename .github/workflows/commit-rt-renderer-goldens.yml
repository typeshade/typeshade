name: commit RT renderer goldens

on:
  push:
    branches:
      - feat/rt-renderer

permissions:
  contents: write

jobs:
  bake-and-commit:
    if: "!contains(github.event.head_commit.message, 'add RT renderer emit goldens')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: emit RT renderer goldens
        run: |
          mkdir -p examples/__emit-goldens__
          bun - <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { compile, emitModule, emitGlslModule } from './src/index.ts';

          const source = readFileSync('examples/rt-renderer-class.shade.ts', 'utf8');
          const result = compile(source);
          const errors = result.diagnostics.filter((d) => d.category === 'error');
          if (errors.length > 0) {
            throw new Error(errors.map((d) => String(d.line) + ':' + String(d.character) + ' ' + String(d.code ?? '—') + ' ' + d.message).join(String.fromCharCode(10)));
          }

          writeFileSync('examples/__emit-goldens__/rt-renderer-class.wgsl', emitModule(result.module));
          writeFileSync('examples/__emit-goldens__/rt-renderer-class.vertex.glsl', emitGlslModule(result.module, 'vertex'));
          writeFileSync('examples/__emit-goldens__/rt-renderer-class.fragment.glsl', emitGlslModule(result.module, 'fragment'));
          EOF
      - name: commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/__emit-goldens__/rt-renderer-class.wgsl \
            examples/__emit-goldens__/rt-renderer-class.vertex.glsl \
            examples/__emit-goldens__/rt-renderer-class.fragment.glsl
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add RT renderer emit goldens [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
