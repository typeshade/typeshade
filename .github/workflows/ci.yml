name: ci

# Verifies: Rule 13.4 (docs/language-design.md; traced in reqs/).

# TypeShade's gate. The jobs below, on every push to main and every pull request:
#
#   quality       ESLint, format, runtime bundle boundary and pull-request document/policy
#                 checks, parallel with the unit workers.
#   unit-pinned   the emitting build and noEmit test/script build, then the selected unit suite
#                 in three workers. Documents-only pull requests select document readers.
#   unit-typescript5 / unit-typescript6
#                 the same build and TypeScript-dependent unit tests, in three workers per
#                 version. Editors ship these versions (#259), so the compiler-facing tests
#                 must agree on each. Every worker proves its installed TypeScript version.
#   check / typescript5 / typescript6
#                 aggregate those workers under the unchanged check names. A failed, cancelled
#                 or unexpectedly skipped dependency fails the corresponding check. One version's
#                 check reads only that version's workers. ci-unit.yml owns worker execution.
#
# Code pull requests select through Vitest's static graph plus conservative external-input
# readers. Other events run the full applicable suite. Sharding divides execution, not coverage;
# every worker uses the same selection and reports its partition. The emit goldens retain the
# same cross-version byte checks, so GPU gates remain on the package's pinned TypeScript.
#   traceability  Doorstop over reqs/ (reqs/README.md): fails on a rule changed or added without
#                 review, a surface section left suspect by a rule it explains, or a verifying file
#                 that no longer names its rule; uploads the traceability matrix as an artifact.
#   compile-gate  every registered example is emitted and COMPILED by real compilers —
#                 the WGSL on Tint (Chromium's WebGPU, on SwiftShader: no GPU needed for
#                 compile / validate correctness) and both GLSL ES 3.00 stages on a real
#                 WebGL2 context. See scripts/compile-gate.ts for what it asserts and how
#                 it proves the instrument can see an error at all.
#   user-journeys TypeShade the way a user meets it: the tarball npm would ship, installed into
#                 a fresh project, with the README's tsconfig.shade.json. Each program in
#                 journeys/ is compiled with the installed `compile()`, checked by the
#                 language service and plain tsc, run on WebGPU, and matched against its own
#                 plain-JavaScript reference and the CPU oracle. See scripts/user-journey.ts.
#   render-gate the merged class-based 3D SDF ray tracer is actually rendered on WebGPU in
#                 headless Chromium and its 48x48 RGBA8 pixels are compared exactly against
#                 the committed image golden. See scripts/render-rt-golden.ts.
#
#   scope         on a pull request, whether the diff changes anything but documents: a `.md`
#                 file outside `src/`, or a Doorstop item under `reqs/`. A documents-only pull
#                 request runs `quality`, `unit-pinned`, `check` and `traceability`. The unit
#                 workers select document readers, narrowing only audited inputs whose fingerprints
#                 still match; the build, lint and format scopes stay whole. It skips the
#                 TypeScript-version workers/checks, `compile-gate`, `user-journeys` and `render-gate`, which
#                 read none. A skipped job reports success, so a required check is not left
#                 waiting. A push to main, a dispatch and a release run every job.
#
# The browser is installed with the PROJECT-LOCAL playwright bin, never `bunx playwright`:
# bunx fetches the standalone package at whatever version is newest, installs THAT
# revision's browser, and the script (resolving through node_modules) then cannot find its
# own revision's binary. `--only-shell` installs chromium-headless-shell, which is what a
# headless `chromium.launch()` resolves to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `.github/workflows/publish.yml` calls this workflow, so the gates a release runs are
  # literally the jobs below rather than a second copy that can drift into a weaker one.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# LINT.IfChange(jobs)
jobs:
  # The package compatibility workflow tests one tarball across consumer OS/Node versions.
  # Whether the diff changes code (anything but documents). Only a pull request can be
  # documents-only; every other event runs every job. A file under `src/` is code whatever its
  # extension (`src/__api__/surface.md` is a snapshot a test reads), and so is a workflow.
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          # Process substitution would hide a failed git diff and mark it documents-only.
          git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/ci-changed-files"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*) code=true ;;
              reqs/*) ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  # Keep source checks parallel with unit shards. Builds stay in each unit worker because
  # tests inspect emitted files as well as source (src/publish-manifest.test.ts).
  quality:
    name: source and policy checks
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - name: runtime bundle boundary
        run: bun scripts/bundle-boundary.ts
      - name: documentation impact
        if: github.event_name == 'pull_request'
        shell: bash
        run: bun scripts/doc-impact.ts --base "origin/${{ github.base_ref }}" --check --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: LINT.IfChange pairs
        if: github.event_name == 'pull_request'
        run: bun scripts/ifchange.ts --base "origin/${{ github.base_ref }}"
      - name: change proposal
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/changes.ts --base "origin/${{ github.base_ref }}"

  unit-pinned:
    name: pinned TypeScript unit shards
    needs: scope
    uses: ./.github/workflows/ci-unit.yml
    with:
      documents: ${{ needs.scope.outputs.code != 'true' }}

  # Versions are declared once. Scalar aliases also feed the singleton matrices that retain
  # the exact check names below; a version upgrade cannot silently leave an old named check.
  unit-typescript5:
    name: TypeScript 5 unit shards
    needs: scope
    if: needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/ci-unit.yml
    with:
      typescript: &typescript5 '5.9.3'
      shards: &typescript-shards '[1,2,3]'

  unit-typescript6:
    name: TypeScript 6 unit shards
    needs: scope
    if: needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/ci-unit.yml
    with:
      typescript: &typescript6 '6.0.3'
      shards: *typescript-shards

  # Required check names stay unchanged. An unsuccessful or unexpectedly skipped dependency
  # must make its check fail; GitHub's default dependency skipping must not turn it green.
  check:
    name: typecheck + unit
    needs: [scope, quality, unit-pinned]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require source checks and every pinned shard
        env:
          SCOPE: ${{ needs.scope.result }}
          QUALITY: ${{ needs.quality.result }}
          UNITS: ${{ needs.unit-pinned.result }}
        run: |
          test "$SCOPE" = success
          test "$QUALITY" = success
          test "$UNITS" = success

  typescript5:
    name: typecheck + unit (TypeScript ${{ matrix.typescript }})
    needs: [scope, unit-typescript5]
    if: always() && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        typescript: [*typescript5]
    steps:
      - name: require every shard for this TypeScript version
        env:
          SCOPE: ${{ needs.scope.result }}
          UNITS: ${{ needs.unit-typescript5.result }}
        run: |
          test "$SCOPE" = success
          test "$UNITS" = success

  typescript6:
    name: typecheck + unit (TypeScript ${{ matrix.typescript }})
    needs: [scope, unit-typescript6]
    if: always() && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        typescript: [*typescript6]
    steps:
      - name: require every shard for this TypeScript version
        env:
          SCOPE: ${{ needs.scope.result }}
          UNITS: ${{ needs.unit-typescript6.result }}
        run: |
          test "$SCOPE" = success
          test "$UNITS" = success

  traceability:
    name: traceability (Doorstop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install doorstop==3.2
      # scripts/doorstop-check.py runs Doorstop with its automatic review of new items off, so a new
      # rule nobody read fails too (its header says why). -C: not every rule has a surface section
      # explaining it. -e: every warning is an error, so an unreviewed rule or a suspect surface
      # link fails. -F: validate without reformatting.
      - run: python scripts/doorstop-check.py -C -e -F
      # The check must fail on a rule nobody reviewed, and this step proves it does. It copies the
      # checkout to $RUNNER_TEMP, blanks the `reviewed:` stamp of one rule there, and expects the
      # wrapper to fail on that rule. The checkout itself is not changed.
      - name: the check fails on a rule nobody reviewed
        shell: bash
        run: |
          rules=(reqs/rules/RULE-*.md)
          rule=${rules[0]}
          id=$(basename "$rule" .md)
          proof="$RUNNER_TEMP/proof"
          rm -rf "$proof"
          cp -a . "$proof"
          cd "$proof"
          sed -i 's/^reviewed: .*/reviewed: null/' "$rule"
          grep -qx 'reviewed: null' "$rule"
          set +e
          python scripts/doorstop-check.py -C -e -F > "$RUNNER_TEMP/proof.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/proof.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the wrapper passed $id with its reviewed stamp blanked"
            exit 1
          fi
          if ! grep -q "$id: needs initial review" "$RUNNER_TEMP/proof.log"; then
            echo "::error::the wrapper failed, but not on $id: needs initial review"
            exit 1
          fi
      - run: doorstop publish all traceability
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability
          path: traceability

  compile-gate:
    name: compile gate (Tint + WebGL2)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run gate:compile
      - run: bun run gate:differential

  user-journeys:
    name: user journeys (packed tarball, WebGPU)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run build
      - run: bun run gate:journeys

  perf-gate:
    name: perf gate (instrument, SwiftShader)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run build
      # A software device: the proof of the instrument and the shape of the report. The run is
      # checked against the runner's committed SwiftShader baseline, `perf/google-swiftshader.json`,
      # with a wide tolerance, since one runner differs from the next; then it is recorded, and the
      # record goes to the log and to an artifact, so that a new baseline is copied from a run of
      # this job, never from another machine (docs/performance.md, A software baseline).
      - run: bun run gate:perf --samples 7 --warmup 2 --n 262144 --software --check --tolerance 0.5 --record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-google-swiftshader
          path: perf/google-swiftshader.json
          if-no-files-found: ignore

  render-gate:
    name: render gate (WebGPU + pixel golden)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run gate:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt-renderer-render
          path: artifacts/rt-renderer-class-48.png
          if-no-files-found: error
# LINT.ThenChange(AGENTS.md:tests)
