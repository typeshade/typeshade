name: ci

# TypeShade's gate. Three jobs, on every push to main and every pull request:
#
#   check         `tsc --build` (the emitting project) + `tsc -p tsconfig.tests.json` (the
#                 noEmit pass over tests, examples and scripts), ESLint, the format check
#                 (Prettier, then the `;` in shader source Prettier cannot reach), then the
#                 unit suite. On a pull request, then the documentation impact of the diff
#                 against its base: fails when a sentence still names a name or file the
#                 change removed, and writes the review list to the job summary
#                 (AGENTS.md#docs-follow-the-code).
#   compile-gate  every registered example is emitted and COMPILED by real compilers —
#                 the WGSL on Tint (Chromium's WebGPU, on SwiftShader: no GPU needed for
#                 compile / validate correctness) and both GLSL ES 3.00 stages on a real
#                 WebGL2 context. See scripts/compile-gate.ts for what it asserts and how
#                 it proves the instrument can see an error at all.
#   user-journeys TypeShade the way a user meets it: the tarball npm would ship, installed into
#                 a fresh project, with the README's tsconfig.shade.json. Each program in
#                 journeys/ is compiled with the installed `compile()`, checked by the
#                 language service and plain tsc, run on WebGPU, and matched against its own
#                 plain-JavaScript reference and the CPU oracle. See scripts/user-journey.ts.
#
# The browser is installed with the PROJECT-LOCAL playwright bin, never `bunx playwright`:
# bunx fetches the standalone package at whatever version is newest, installs THAT
# revision's browser, and the script (resolving through node_modules) then cannot find its
# own revision's binary. `--only-shell` installs chromium-headless-shell, which is what a
# headless `chromium.launch()` resolves to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `.github/workflows/publish.yml` calls this workflow, so the gates a release runs are
  # literally the jobs below rather than a second copy that can drift into a weaker one.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The documentation-impact step diffs against the merge base with the PR's base.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - name: documentation impact
        if: github.event_name == 'pull_request'
        shell: bash
        run: bun scripts/doc-impact.ts --base "origin/${{ github.base_ref }}" --check --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  compile-gate:
    name: compile gate (Tint + WebGL2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run gate:compile

  user-journeys:
    name: user journeys (packed tarball, WebGPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run build
      - run: bun run gate:journeys
