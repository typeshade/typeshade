name: ci

# Verifies: Rule 13.4 (docs/language-design.md; traced in reqs/).

# TypeShade's gate. The jobs below, on every push to main and every pull request:
#
#   check         `tsc --build` (the emitting project) + `tsc -p tsconfig.tests.json` (the
#                 noEmit pass over tests, examples and scripts), ESLint, the format check
#                 (Prettier, then the `;` in shader source Prettier cannot reach), then the
#                 unit suite. On a pull request, then the documentation impact of the diff
#                 against its base: fails when a sentence still names a name or file the
#                 change removed, and writes the review list to the job summary; then every
#                 IfChange block (scripts/ifchange.ts) the diff changed must have its targets
#                 changed too, unless a commit message says NO_IFTTT=<reason>
#                 (AGENTS.md#docs-follow-the-code); then a diff that touches a rule, an export
#                 or a downstream-visible surface must name an accepted proposal it stays
#                 inside, with a `Change: NNNN` line (scripts/changes.ts, changes/README.md).
#   typescript-versions
#                 `bun run build` and the unit tests that can load TypeScript again, with
#                 `typescript` replaced by the newest 5.x and by 6.0, the versions the editors
#                 that load the compiler ship (#259). `scripts/typescript-tests.ts` lists those
#                 tests; one that never loads TypeScript gives `check`'s result on every version. `check` installs the 5.6.3 that package.json pins, and a newer
#                 TypeScript has moved what this repository reads twice without it showing:
#                 TS2454 on workgroup memory from 5.7 (#247), and the printed form the API
#                 surface snapshot is compared by, on 5.7 and again on 6.0
#                 (src/api-surface.test.ts). No lint, format or GPU gate here: the first two
#                 judge the source, and the emit goldens in the unit suite hold the WGSL and GLSL
#                 to the same text on every version, so the GPU gates would compile what they
#                 compile on 5.6.3. One check per version, named for it.
#   traceability  Doorstop over reqs/ (reqs/README.md): fails on a rule changed without review,
#                 a surface section left suspect by a rule it explains, or a verifying file that
#                 no longer names its rule; uploads the traceability matrix as an artifact.
#   compile-gate  every registered example is emitted and COMPILED by real compilers —
#                 the WGSL on Tint (Chromium's WebGPU, on SwiftShader: no GPU needed for
#                 compile / validate correctness) and both GLSL ES 3.00 stages on a real
#                 WebGL2 context. See scripts/compile-gate.ts for what it asserts and how
#                 it proves the instrument can see an error at all.
#   user-journeys TypeShade the way a user meets it: the tarball npm would ship, installed into
#                 a fresh project, with the README's tsconfig.shade.json. Each program in
#                 journeys/ is compiled with the installed `compile()`, checked by the
#                 language service and plain tsc, run on WebGPU, and matched against its own
#                 plain-JavaScript reference and the CPU oracle. See scripts/user-journey.ts.
#   render-gate the merged class-based 3D SDF ray tracer is actually rendered on WebGPU in
#                 headless Chromium and its 48x48 RGBA8 pixels are compared exactly against
#                 the committed image golden. See scripts/render-rt-golden.ts.
#
#   scope         on a pull request, whether the diff changes anything but documents: a `.md`
#                 file outside `src/`, or a Doorstop item under `reqs/`. A documents-only pull
#                 request runs `check` and `traceability`, which read the documents (the unit
#                 suite reads the rules, the surface and the proposals), and skips
#                 `typescript-versions`, `compile-gate`, `user-journeys` and `render-gate`, which
#                 read none. A skipped job reports success, so a required check is not left
#                 waiting. A push to main, a dispatch and a release run every job.
#
# The browser is installed with the PROJECT-LOCAL playwright bin, never `bunx playwright`:
# bunx fetches the standalone package at whatever version is newest, installs THAT
# revision's browser, and the script (resolving through node_modules) then cannot find its
# own revision's binary. `--only-shell` installs chromium-headless-shell, which is what a
# headless `chromium.launch()` resolves to.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `.github/workflows/publish.yml` calls this workflow, so the gates a release runs are
  # literally the jobs below rather than a second copy that can drift into a weaker one.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# LINT.IfChange(jobs)
jobs:
  # Whether the diff changes code (anything but documents). Only a pull request can be
  # documents-only; every other event runs every job. A file under `src/` is code whatever its
  # extension (`src/__api__/surface.md` is a snapshot a test reads), and so is a workflow.
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*) code=true ;;
              reqs/*) ;;
              *.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "origin/$BASE...HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The documentation-impact step diffs against the merge base with the PR's base.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: bun run lint
      - run: bun run format:check
      # The runtime carries no compiler, and stays in its size budget (Rule 11.11, change 0025).
      - name: runtime bundle boundary
        run: bun scripts/bundle-boundary.ts
      # The unit suite, the emit goldens among it. A golden that no longer matches fails here;
      # an intended change is re-baked with `bun run bake:goldens` and committed with the diff.
      - run: bun run test
      - name: documentation impact
        if: github.event_name == 'pull_request'
        shell: bash
        run: bun scripts/doc-impact.ts --base "origin/${{ github.base_ref }}" --check --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: LINT.IfChange pairs
        if: github.event_name == 'pull_request'
        run: bun scripts/ifchange.ts --base "origin/${{ github.base_ref }}"
      - name: change proposal
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun scripts/changes.ts --base "origin/${{ github.base_ref }}"

  # The type check and the unit suite on the TypeScript versions editors ship (#259). The
  # editor that loads the language service runs its own TypeScript, so what this repository
  # reads from TypeScript has to hold on more than the 5.6.3 `check` installs: 5.7 and later
  # report TS2454 on workgroup memory (#247), and 5.7 and 6.0 each print a type the API surface
  # snapshot reads differently.
  #
  # A leg installs its version over the pin with `--no-save`, so package.json and the peer range
  # stay as they are, and then proves it runs that version: an install that did nothing would
  # pass as a second run of 5.6.3. `publish.yml` calls this file, so a release waits on the legs
  # too. Each leg is its own check, `typecheck + unit (TypeScript X)`, and none is required
  # until the ruleset names it; a matrix entry that changes renames its check.
  #
  # This is a job of its own, and `check` is not made a matrix: a required check is a job's
  # `name`, and a matrix would rename `typecheck + unit` and leave every pull request waiting on
  # a check that never reports (CLAUDE.md#merging).
  typescript-versions:
    name: typecheck + unit (TypeScript ${{ matrix.typescript }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # The two versions fail for different reasons: one red leg must not hide the other's result.
      fail-fast: false
      matrix:
        # The newest 5.x and 6.0. 5.6.3 stays `check`'s, from package.json.
        typescript: ['5.9.3', '6.0.3']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun add --no-save typescript@${{ matrix.typescript }}
      - name: the leg runs the TypeScript it names
        env:
          WANT: ${{ matrix.typescript }}
        run: |
          node_ts="$(node -p "require('typescript').version")"
          tsc_ts="$(./node_modules/.bin/tsc --version)"
          echo "the leg names TypeScript $WANT; node resolves $node_ts; tsc says '$tsc_ts'"
          test "$node_ts" = "$WANT"
          test "$tsc_ts" = "Version $WANT"
      - run: bun run build
      # Only the tests that can load TypeScript: the rest give `check`'s result on every version.
      - name: the unit tests that load TypeScript
        run: bunx vitest run $(bun scripts/typescript-tests.ts --summary)

  traceability:
    name: traceability (Doorstop)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install doorstop==3.2
      # -C: not every rule has a surface section explaining it. -e: every warning is an error, so
      # an unreviewed rule or a suspect surface link fails. -F: validate without reformatting.
      - run: doorstop -C -e -F
      - run: doorstop publish all traceability
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability
          path: traceability

  compile-gate:
    name: compile gate (Tint + WebGL2)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run gate:compile
      - run: bun run gate:differential

  user-journeys:
    name: user journeys (packed tarball, WebGPU)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run build
      - run: bun run gate:journeys

  render-gate:
    name: render gate (WebGPU + pixel golden)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: bun run gate:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rt-renderer-render
          path: artifacts/rt-renderer-class-48.png
          if-no-files-found: error
# LINT.ThenChange(AGENTS.md:tests)
