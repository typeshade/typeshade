name: rebake-api-surface
on:
  push:
    branches: [chore/rebake-api-surface]
permissions:
  contents: write
jobs:
  rebake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run bake:api-surface
      - name: Commit generated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/__api__/surface.md
          if git diff --cached --quiet; then
            echo 'No API surface changes.'
          else
            git commit -m 'chore: rebake public API surface'
            git push
          fi
