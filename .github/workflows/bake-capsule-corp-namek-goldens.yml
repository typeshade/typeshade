name: bake-capsule-corp-namek-goldens

on:
  push:
    branches:
      - verify/capsule-corp-namek-class

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run bake:goldens

      - name: Commit generated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/__emit-goldens__
          if git diff --cached --quiet; then
            echo "No golden changes."
            exit 0
          fi
          git commit -m "test: bake Capsule Corp. Namek goldens"
          git push
