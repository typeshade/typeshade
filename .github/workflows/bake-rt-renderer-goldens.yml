name: bake RT renderer goldens

on:
  push:
    branches:
      - feat/rt-renderer

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/rt-renderer
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: UPDATE_EMIT_GOLDENS=1 bunx vitest run examples/emit-goldens.test.ts examples/shade-examples.test.ts
      - name: Commit generated goldens
        run: |
          if git diff --quiet -- examples/__emit-goldens__; then
            echo "No golden changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/__emit-goldens__
          git commit -m "test: update RT renderer emit goldens"
          git fetch origin feat/rt-renderer
          git rebase origin/feat/rt-renderer
          git push origin HEAD:feat/rt-renderer
