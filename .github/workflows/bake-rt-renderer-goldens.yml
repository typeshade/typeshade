name: bake RT renderer goldens

on:
  push:
    branches:
      - feat/rt-renderer

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: UPDATE_EMIT_GOLDENS=1 bunx vitest run examples/shade-examples.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rt-renderer-goldens
          path: |
            examples/__emit-goldens__/rt-renderer-class.wgsl
            examples/__emit-goldens__/rt-renderer-class.vertex.glsl
            examples/__emit-goldens__/rt-renderer-class.fragment.glsl
