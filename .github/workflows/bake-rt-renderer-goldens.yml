name: bake RT renderer goldens

on:
  push:
    branches:
      - feat/rt-renderer

permissions:
  contents: write

jobs:
  bake:
    if: "!contains(github.event.head_commit.message, 'update RT renderer emit goldens')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: bake RT renderer goldens
        run: UPDATE_EMIT_GOLDENS=1 bunx vitest run examples/emit-goldens.test.ts
      - name: commit updated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/__emit-goldens__/rt-renderer-class.wgsl examples/__emit-goldens__/rt-renderer-class.vertex.glsl examples/__emit-goldens__/rt-renderer-class.fragment.glsl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: update RT renderer emit goldens"
          git push origin "HEAD:$GITHUB_REF_NAME"
