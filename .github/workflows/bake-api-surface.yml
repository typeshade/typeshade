name: bake-api-surface

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run bake:api-surface
      - name: Commit generated snapshot
        run: |
          if git diff --quiet -- src/__api__/surface.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/__api__/surface.md
          git commit -m 'chore: bake public API surface'
          git push
