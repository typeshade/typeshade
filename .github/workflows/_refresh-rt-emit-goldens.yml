name: refresh RT emit goldens

on:
  push:
    branches:
      - fix/rt-screen-coordinate-orientation

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh RT emit goldens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: UPDATE_EMIT_GOLDENS=1 bun run bake:goldens
      - name: Commit refreshed goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/__emit-goldens__
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh RT emit goldens"
          git push origin HEAD:${GITHUB_REF_NAME}
