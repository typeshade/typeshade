name: package compatibility

on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.node-version'
      - '.bun-version'
      - '.github/workflows/package-smoke.yml'
      - '.github/actions/change-scope/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-compatibility-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A pull request whose range declares and passes `Move: comments` builds no package and runs
  # no smoke. `Move: pure` keeps one smoke (Linux, Node 24). Other events run all five.
  scope:
    name: move scope (package smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      move: ${{ steps.move.outputs.move || 'none' }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: move
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/change-scope
        with:
          event: ${{ github.event_name }}
          base: ${{ github.base_ref }}
          title: ${{ github.event.pull_request.title }}
      - id: matrix
        shell: bash
        env:
          MOVE: ${{ steps.move.outputs.move }}
        run: |
          if [ "$MOVE" = pure ]; then
            echo 'matrix=[{"os":"ubuntu-latest","node":"24"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"os":"ubuntu-latest","node":"20"},{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"windows-latest","node":"24"},{"os":"macos-latest","node":"24"}]' >> "$GITHUB_OUTPUT"
          fi

  pack:
    name: build the consumer package
    needs: scope
    if: needs.scope.outputs.move != 'comments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      typescript: ${{ steps.versions.outputs.typescript }}
      vite: ${{ steps.versions.outputs.vite }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: versions
        run: |
          node --input-type=module -e 'import { readFileSync, appendFileSync } from "node:fs"; const p = JSON.parse(readFileSync("package.json")); for (const k of ["typescript", "vite"]) appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${p.devDependencies[k]}\n`);'
      - run: bun run build
      - run: bun scripts/publish-manifest.ts --write
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-package
          path: ${{ runner.temp }}/typeshade-*.tgz
          if-no-files-found: error

  smoke:
    name: package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [scope, pack]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: consumer-package
          path: candidate
      - name: prepare a fresh consumer
        run: |
          mkdir smoke
          cp scripts/package-smoke.mjs smoke/smoke.mjs
          cd smoke
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund ../candidate/*.tgz "typescript@${{ needs.pack.outputs.typescript }}" "vite@${{ needs.pack.outputs.vite }}"
      - name: verify the installed package
        run: node smoke/smoke.mjs
