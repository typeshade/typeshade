# Execute TypeShade's lowered WebGL2 compute passes in a real Chromium context.
# No WebGPU fallback: the browser test asserts rt.tier === 'webgl2'.
name: MNIST WebGL2 validation

on:
  pull_request:
    paths:
      - '.github/workflows/mnist-webgl2-validation.yml'
      - 'journeys/mnist/**'

permissions:
  contents: read

jobs:
  webgl2-mnist:
    name: WebGL2 compute stages vs independent reference
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: WebGL2 MNIST forward/loss/reduction/backward/SGD numeric check
        timeout-minutes: 14
        run: |
          node --experimental-strip-types journeys/mnist/test-webgl2.mjs --stagesOnly | tee mnist-webgl2-stages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnist-webgl2-validation
          path: mnist-webgl2-stages.log
          if-no-files-found: ignore
