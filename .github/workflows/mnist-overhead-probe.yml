# Temporary software-WebGPU measurement for PR #556.
# This runs the real checked-in MNIST harness, not a simulated benchmark.
name: MNIST execution overhead probe

on:
  pull_request:
    paths:
      - '.github/workflows/mnist-overhead-probe.yml'
      - 'journeys/mnist/**'

permissions:
  contents: read

jobs:
  software-webgpu:
    name: SwiftShader four-mode comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Inspect TypeShade generated WGSL and optimization tiers
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { compileExperiment, manifest } from './journeys/mnist/cpu.mjs';
          import { packModule } from './dist/src/index.js';
          const m = compileExperiment();
          const packs = {
            default: manifest(),
            O0: packModule(m, { emit: { level: 'O0' } }),
            O1: packModule(m, { emit: { level: 'O1' } }),
            O2: packModule(m, { emit: { level: 'O2' } }),
          };
          const rows = {};
          for (const [name, pack] of Object.entries(packs)) {
            writeFileSync('mnist-'+name+'.wgsl', pack.wgsl);
            rows[name] = {
              sha256: createHash('sha256').update(pack.wgsl).digest('hex'),
              bytes: Buffer.byteLength(pack.wgsl),
              lines: pack.wgsl.split('\n').length,
              bindingNames: pack.bindings.map(b => ({
                name: b.name, access: b.access, group: b.group, binding: b.binding,
              })),
              entryPoints: pack.entries.map(e => ({
                name: e.name, stage: e.stage, workgroupSize: e.workgroupSize,
                bindings: e.bindings.map(b => ({name:b.name,writes:b.writes})),
              })),
            };
          }
          console.log(JSON.stringify(rows, null, 2));
          writeFileSync('mnist-generated-metadata.json', JSON.stringify(rows,null,2));
          JS
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: GPU correctness and submission-mode tests
        run: node --experimental-strip-types journeys/mnist/test-webgpu.mjs --software
      - name: Four-mode real TypeShade SwiftShader measurements
        run: |
          node --experimental-strip-types journeys/mnist/perf-probe.mjs --count 256 --epochs 2 --repeats 3 --software | tee mnist-perf-results.log
      - name: Cache official MNIST gzip IDX files
        run: |
          node --experimental-strip-types journeys/mnist/run.ts --download --train 1 --test 1 --epochs 1 > mnist-download-check.log
      - name: Real MNIST four-mode repeated measurements
        run: |
          node --experimental-strip-types journeys/mnist/perf-probe.mjs --mnist --count 1024 --epochs 5 --repeats 3 --software | tee mnist-real-subset-perf-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnist-four-mode-software-webgpu
          path: |
            mnist-perf-results.log
            mnist-real-subset-perf-results.log
            mnist-download-check.log
            mnist-generated-metadata.json
            mnist-*.wgsl
          if-no-files-found: ignore
