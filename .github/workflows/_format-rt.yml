name: temporary format probe

on:
  push:
    branches:
      - test/rt-renderer-image-golden

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./node_modules/.bin/prettier --write AGENTS.md scripts/render-rt-golden.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-rt-files
          path: |
            AGENTS.md
            scripts/render-rt-golden.ts
