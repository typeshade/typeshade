name: temporary format probe

on:
  push:
    branches:
      - test/rt-renderer-image-golden

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore: apply prettier')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./node_modules/.bin/prettier --write AGENTS.md scripts/render-rt-golden.ts
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md scripts/render-rt-golden.ts
          if git diff --cached --quiet; then
            echo "formatter made no changes"
            exit 0
          fi
          git commit -m "chore: apply prettier to RT gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
