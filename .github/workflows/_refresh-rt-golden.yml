name: refresh RT render golden

on:
  push:
    branches:
      - fix/rt-screen-coordinate-orientation

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh RT render golden'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: UPDATE_RT_GOLDEN=1 bun run gate:render
      - name: Commit refreshed golden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/__render-goldens__/rt-renderer-class-48.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh RT render golden"
          git push origin HEAD:${GITHUB_REF_NAME}
